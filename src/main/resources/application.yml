server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: reservas-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservasdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:reservas_user}
    password: ${DB_PASSWORD:reservas123}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

quadras:
  service:
    url: ${QUADRAS_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}