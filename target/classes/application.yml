server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: reservas-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservasdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:reservas_user}
    password: ${DB_PASSWORD:reservas123}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

quadras:
  service:
    url: ${QUADRAS_SERVICE_URL:http://localhost:8081}
